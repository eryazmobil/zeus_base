pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()

        // ZeusBaseData kütüphanesi projenin içindeki zeus-repo/ klasöründen gelir.
        // Sadece derlenmiş paket (.aar) vardır, kaynak kod yoktur; token gerekmez.
        // Yeni sürüm ZeusBaseData tarafında ./publish-to-app.sh ile buraya yazılır.
        maven {
            url = uri(new File(settingsDir, "zeus-repo"))
            content { includeGroup("eryaz.software.zeus") }
        }
    }
}

rootProject.name = "zeus_base"
include ':app'
