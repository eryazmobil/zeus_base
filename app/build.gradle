plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'androidx.navigation.safeargs'
    id 'kotlin-kapt'
    id("kotlin-parcelize")
    id 'com.google.gms.google-services'
    id("com.google.firebase.crashlytics")
}

android {
    namespace 'eryaz.software.basewms'
    compileSdk 35

    defaultConfig {
        applicationId "eryaz.software.basewms"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    applicationVariants.configureEach { variant ->
        variant.resValue "string", "versionName", variant.versionName
        variant.outputs.configureEach {
            def versionName = variant.versionName
            def appName = "zeus-basewms"
            outputFileName = "${appName}-${versionName}.apk"
        }
    }

    buildTypes {
        release {
            // Release APK R8 ile küçültülür ve karartılır (debug etkilenmez)
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        dataBinding true
        viewBinding true
    }

    lintOptions {
        checkReleaseBuilds false
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation "com.google.truth:truth:1.4.5"
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'eryaz.software.zeus:zeus-ui:1.0.2'

    // Navigation Component
    implementation "androidx.navigation:navigation-fragment-ktx:2.7.7"
    implementation "androidx.navigation:navigation-ui-ktx:2.7.7"

    // Lifecycle components
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'

    //WorkManager
    implementation("androidx.work:work-runtime-ktx:2.8.1")

    //Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1"

    //Extra
    implementation "net.yslibrary.keyboardvisibilityevent:keyboardvisibilityevent:2.1.0"
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    implementation "com.github.bumptech.glide:glide:4.14.2"
    implementation 'com.github.razir.progressbutton:progressbutton:2.1.0'
    implementation "com.airbnb.android:lottie:5.2.0"

    implementation platform('com.google.firebase:firebase-bom:29.0.1')
    implementation("com.google.firebase:firebase-crashlytics")
    implementation("com.google.firebase:firebase-analytics")
    implementation("com.google.firebase:firebase-messaging")

    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0-alpha01"

}

kapt {
    correctErrorTypes = true
}

apply from: "$rootDir/gradle/zeus-guard.gradle"
